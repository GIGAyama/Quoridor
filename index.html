<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <!--
      Content Security Policy。

      ・script-src は 'self' のみ。インラインの <script> と onclick= はすべて動かなくなるので、
        本体は Vite が出す外部ファイル、インストールの合図の捕捉も install-hook.js に置いている。
        'unsafe-inline' を足して済ませてはいけない。それでは入れた意味がほとんど無くなる。
      ・style-src に 'unsafe-inline' が要るのは、盤面のマス目の位置を
        React の style 属性で計算して当てているため（盤面サイズが 5/7/9 と変わる）。
      ・外部から読むものは1つも無いので、CDN もフォントも許可していない。
        学校のフィルタリングで何が塞がれても、このアプリは起動する。
      ・frame-ancestors はここには書かない。<meta> では無視され、
        読み込みのたびにコンソールへ警告が出るだけになる。
        他サイトへの埋め込みを止めるには HTTP ヘッダーが必要だが、GitHub Pages では足せない。
        独自ドメインや CDN を挟むときは、そちら側で frame-ancestors 'none' を設定すること。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <!--
      インストールの合図を「いちばん先に」受け取る。
      Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
      React の読み込みより後ろで待ち構えると合図を取りこぼし、
      通信が遅い端末で「アプリにする」ボタンが出なくなる。
    -->
    <script src="/install-hook.js"></script>

    <!--
      本体が描けなかったとき（＝真っ白のとき）に、直す手立てを画面へ出す番人。
      本体とは別のファイルにしてあるので、本体が読めない・落ちた場合でも動く。
      本体より先に読み込むこと。あとに置くと、本体が読めなかった場合に一緒に落ちる。
    -->
    <script src="/boot-check.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="2人で遊べる、子ども向けコリドール風対戦パズルゲーム" />
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GIGA school">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="カベカベ合戦！">
    <meta property="og:description" content="2人で遊べる、子ども向けコリドール風対戦パズルゲーム">
    <meta property="og:url" content="https://quoridor.giga-school.com/">
    <meta property="og:image" content="https://giga-school.com/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="カベ合戦" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      apple-touch-icon には透明を含む画像を指さない。
      iOS は透明部分を黒で埋めるため、ホーム画面でアイコンの四隅だけが黒く出る。
      この画像の透明画素は 0.00%（tools/measure-icons.mjs で確認済み）。
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>カベカベ合戦！</title>

    <!--
      本体が1行も動かなかったときに、真っ白ではなく読める案内を出すための控え。

      なぜ JavaScript で書かないか：
        boot-check.js も本体も、読み込めなければ動かない。
        実際に、配信の設定を誤ってビルド結果ではなくソースが配られたとき、
        js は1つも読み込めず、画面には何も出なかった（真っ白）。
        そういう場面でも必ず出したいので、HTML と CSS だけで組む。

      なぜ 10 秒あとに出すか：
        校内 Wi-Fi が遅いだけの端末に「よみこめませんでした」と出さないため。
        animation-delay は prefers-reduced-motion の一括上書き
        （animation-duration だけを潰す）では消えないので、ここでも効く。

      本体が描けたら、React が #root の中身ごと置きかえるので自然に消える。
    -->
    <style>
      #boot-fallback {
        opacity: 0;
        animation: boot-fallback-in 1ms linear 10s forwards;
        /* 100vh 単独はモバイルのアドレスバー分はみ出す。dvh を使い、無い端末には vh を回す */
        min-height: 100vh;
        min-height: 100dvh;
      }
      @keyframes boot-fallback-in { to { opacity: 1; } }
    </style>
  </head>
  <body style="margin: 0; background: #fff9c4">
    <noscript>このアプリを遊ぶにはJavaScriptを有効にしてください。</noscript>
    <div id="root">
      <div
        id="boot-fallback"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          box-sizing: border-box;
          font-family: ui-rounded, 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
          color: #1f2937;
        "
      >
        <div
          style="
            max-width: 520px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
            text-align: center;
          "
        >
          <div style="font-size: 56px; line-height: 1">🚧</div>
          <h1 style="font-size: 24px; margin: 12px 0">アプリを よみこめませんでした</h1>
          <p style="font-size: 16px; line-height: 1.7; margin: 0 0 20px">
            もういちど ひらいてみてください。
          </p>
          <p style="font-size: 13px; line-height: 1.7; margin: 0; color: #6b7280">
            先生へ：直らないときは、アドレスの うしろに
            <code style="background: #f3f4f6; padding: 2px 6px; border-radius: 4px">?fix=1</code>
            を付けて開いてください。<br />
            それでも この画面のままなら、配信の設定（GitHub Pages のソース）が
            <strong>GitHub Actions</strong> になっているか確認してください。
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
