<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <!--
      Content Security Policy。

      ・script-src は 'self' のみ。インラインの <script> と onclick= はすべて動かなくなるので、
        本体は Vite が出す外部ファイル、インストールの合図の捕捉も install-hook.js に置いている。
        'unsafe-inline' を足して済ませてはいけない。それでは入れた意味がほとんど無くなる。
      ・style-src に 'unsafe-inline' が要るのは、盤面のマス目の位置を
        React の style 属性で計算して当てているため（盤面サイズが 5/7/9 と変わる）。
      ・外部から読むものは1つも無いので、CDN もフォントも許可していない。
        学校のフィルタリングで何が塞がれても、このアプリは起動する。
      ・frame-ancestors はここには書かない。<meta> では無視され、
        読み込みのたびにコンソールへ警告が出るだけになる。
        他サイトへの埋め込みを止めるには HTTP ヘッダーが必要だが、GitHub Pages では足せない。
        独自ドメインや CDN を挟むときは、そちら側で frame-ancestors 'none' を設定すること。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <!--
      インストールの合図を「いちばん先に」受け取る。
      Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
      React の読み込みより後ろで待ち構えると合図を取りこぼし、
      通信が遅い端末で「アプリにする」ボタンが出なくなる。
    -->
    <script src="/install-hook.js"></script>

    <!--
      本体が描けなかったとき（＝真っ白のとき）に、直す手立てを画面へ出す番人。
      本体とは別のファイルにしてあるので、本体が読めない・落ちた場合でも動く。
      本体より先に読み込むこと。あとに置くと、本体が読めなかった場合に一緒に落ちる。
    -->
    <script src="/boot-check.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="2人で遊べる、子ども向けコリドール風対戦パズルゲーム" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="カベ合戦" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      apple-touch-icon には透明を含む画像を指さない。
      iOS は透明部分を黒で埋めるため、ホーム画面でアイコンの四隅だけが黒く出る。
      この画像の透明画素は 0.00%（tools/measure-icons.mjs で確認済み）。
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>カベカベ合戦！</title>
  </head>
  <body>
    <noscript>このアプリを遊ぶにはJavaScriptを有効にしてください。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
