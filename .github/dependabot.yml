version: 2
updates:
  # 月1回にとどめるのは、授業で使うアプリを頻繁に作り直したくないため。
  # メジャー更新は自動で取り込まない（Part III 絶対安全規則 6）。
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
