<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />
    <title>つながっていません｜カベカベ合戦！</title>
    <!--
      このページは「ネットにつながらず、アプリ本体も手元にない」ときに出る。
      だから外部の資産にも JavaScript にも頼らない。
      色も文字も自前で持ち、開き直しは <a href> で行う（インライン onclick は CSP に引っかかる）。
    -->
    <style>
      :root {
        color-scheme: light;
        --fs-title: clamp(22px, 3.4vw + 12px, 34px);
        --fs-body: clamp(15px, 1.6vw + 10px, 18px);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem calc(1.5rem + env(safe-area-inset-right, 0px))
                 calc(1.5rem + env(safe-area-inset-bottom, 0px))
                 calc(1.5rem + env(safe-area-inset-left, 0px));
        text-align: center;
        /* アプリ本体と同じ配色・同じフォント。別のサイトに来たと思わせない。 */
        background-color: #fff9c4;
        background-image:
          radial-gradient(#ffe082 20%, transparent 20%),
          radial-gradient(#ffe082 20%, transparent 20%);
        background-position: 0 0, 25px 25px;
        background-size: 50px 50px;
        color: #1f2937;
        font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Zen Maru Gothic",
          "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
        font-size: var(--fs-body);
        line-height: 1.8;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      @supports not (height: 100dvh) {
        body { min-height: 100vh; }
      }
      .card {
        background: #fff;
        border: 4px solid #fff;
        border-radius: 1.5rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 2rem 1.5rem;
        max-width: 26rem;
        width: 100%;
      }
      .mark { font-size: clamp(48px, 12vw, 72px); line-height: 1; }
      h1 {
        font-size: var(--fs-title);
        color: #1d4ed8;      /* 白地で 7.0:1 */
        margin: 0.75rem 0 0.5rem;
      }
      p { margin: 0.5rem 0; color: #374151; }   /* 白地で 10.3:1 */
      rt { color: inherit; font-size: 0.6em; font-weight: 400; }
      .retry {
        display: inline-block;
        margin-top: 1.25rem;
        min-width: 44px;
        min-height: 44px;
        padding: 0.85rem 2rem;
        border-radius: 999px;
        background: #1d4ed8;
        color: #fff;          /* 7.0:1 */
        font-weight: 700;
        font-size: 1.125rem;
        text-decoration: none;
      }
      .retry:focus-visible { outline: 3px solid #1f2937; outline-offset: 3px; }
      .hint { color: #4b5563; font-size: 0.9em; margin-top: 1.25rem; }
      @media (forced-colors: active) {
        .card { border: 2px solid CanvasText; }
        .retry { border: 2px solid ButtonText; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">🚧</div>
      <h1>いま インターネットに つながっていません</h1>
      <p>
        <ruby>電波<rp>(</rp><rt>でんぱ</rt><rp>)</rp></ruby>が とどく ところで、
        もういちど ひらいてみてね。
      </p>
      <a class="retry" href="./">もういちど ひらく</a>
      <p class="hint">
        アプリを ホームがめんに <ruby>追加<rp>(</rp><rt>ついか</rt><rp>)</rp></ruby>しておくと、
        つぎからは つながっていなくても あそべます。
      </p>
    </div>
  </body>
</html>
